{%  extends "base.html" %}

{% block content %}
    <div class="container page-container">
        <p class="text-uppercase fw-semibold mb-3" style="letter-spacing: 0.08em;">Your basket</p>

        <div class="container">
            <div style="margin-top: 3px;">
                {% for fishId, item in basket.items() %}
                    <div style="margin-bottom: 3px;">
                        <div class="row align-items-center">
                            <div class="col">
                                <p class="mb-0 fw-semibold">{{ item.name }} x {{ item.quantity }}</p>
                                <p class="mb-0 text-muted fw-semibold">£{{ item.price * item.quantity }}</p>
                            </div>
                            <div class="col-auto">
                                <form action="/basket/remove/{{ fishId }}" method="POST">
                                    <button type="submit">Remove</button>
                                </form>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>

            <div class="row mt-3">
                <div class="col">
                    <p class="mb-0 fw-semibold">Total: £{{ total }}</p>
                </div>
            </div>

            <a href="/checkout" class="btn btn-dark w-100 mt-3 py-2">Proceed to checkout</a>
        </div>
    </div>
{% endblock %}
